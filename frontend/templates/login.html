<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | CIT 21MDS56</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=2.2">
    <style>
        .login-box {
            max-width: 420px;
            margin: 6rem auto;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body style="background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
    <div class="login-box">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
            <h2 style="margin: 0; font-size: 1.4rem; color: #38bdf8;">Municipal Admin Console</h2>
            <p style="margin: 0.35rem 0 0 0; font-size: 0.85rem; color: #94a3b8;">CIT 21MDS56 Air Quality & Public Health System</p>
        </div>

        {% if error %}
        <div style="background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; color: #fca5a5; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem;">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; color:#cbd5e1; margin-bottom:0.4rem; font-weight:600;">Username</label>
                <input type="text" name="username" class="form-control" style="width:100%; background:#0f172a; border:1px solid #334155; padding:0.65rem; border-radius:6px; color:#fff;" placeholder="admin" required autofocus>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display:block; font-size:0.85rem; color:#cbd5e1; margin-bottom:0.4rem; font-weight:600;">Password</label>
                <input type="password" name="password" class="form-control" style="width:100%; background:#0f172a; border:1px solid #334155; padding:0.65rem; border-radius:6px; color:#fff;" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-danger" style="width:100%; padding:0.75rem; justify-content:center; font-size:0.95rem; font-weight:700;">
                Sign In to Admin Console
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/" style="color: #94a3b8; font-size: 0.85rem; text-decoration: none;">&larr; Return to Public Dashboard</a>
        </div>
    </div>
</body>
</html>
