<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Health Alerts & Outbreak History | CIT 21MDS56</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=2.2">
    <style>
        .alerts-container {
            max-width: 1050px;
            margin: 2rem auto;
            padding: 1.5rem;
        }
        .alert-card-item {
            background: #1e293b;
            border-radius: 8px;
            border-left: 6px solid #dc2626;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-top: 1px solid #334155;
            border-right: 1px solid #334155;
            border-bottom: 1px solid #334155;
        }
        .alert-card-item.compound {
            border-left: 6px solid #b91c1c;
            background: linear-gradient(90deg, rgba(185, 28, 28, 0.15), #1e293b 40%);
        }
    </style>
</head>
<body style="background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">

    <!-- Navigation Header -->
    <header class="navbar" style="border-bottom: 1px solid #1e293b; padding: 0.75rem 2rem;">
        <div class="brand">
            <span class="brand-icon">🚨</span>
            <div>
                <a href="/" style="color:inherit; text-decoration:none;" class="brand-title">Early-Warning System Dashboard</a>
                <div class="brand-subtitle">Public Health Alerts &amp; Outbreak Surveillance History (Feature I)</div>
            </div>
        </div>
        <div class="nav-actions">
            <a href="/" class="btn btn-secondary">📊 Main Dashboard</a>
            <a href="/check" class="btn btn-secondary">📍 Citizen Portal</a>
            <a href="/status" class="btn btn-secondary">⚙️ Pipeline Health</a>
        </div>
    </header>

    <main class="alerts-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <div>
                <h1 style="font-size: 1.6rem; font-weight: 700; margin: 0; color: #ef4444;">🚨 Emergency Outbreak Notifications Log</h1>
                <p style="color: #94a3b8; font-size: 0.9rem; margin: 0.25rem 0 0 0;">
                    Automated alert dispatches logged to MongoDB with 6-hour rate cooldown.
                </p>
            </div>
            <div style="display:flex; gap:0.5rem;">
                <select id="filter-city" class="form-control" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:0.5rem; border-radius:6px; font-size:0.85rem;">
                    <option value="">All Metropolitan Regions</option>
                    <option value="Coimbatore">Coimbatore</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Bengaluru">Bengaluru</option>
                </select>
            </div>
        </div>

        <div id="alerts-list">
            <div style="text-align:center; padding:3rem; color:#94a3b8;">Loading alert history...</div>
        </div>
    </main>

    <script>
        let allAlerts = [];
        const alertsList = document.getElementById("alerts-list");
        const cityFilter = document.getElementById("filter-city");

        async function loadAlerts() {
            try {
                // Fetch alerts from API
                const res = await fetch("/api/alerts");
                const json = await res.json();
                allAlerts = json.alerts || [];

                // If empty, generate/seed from critical zones currently active
                if (allAlerts.length === 0) {
                    const zRes = await fetch("/api/zones/risk");
                    const zJson = await zRes.json();
                    if (zJson.data) {
                        const critical = zJson.data.filter(z => z.compound_alert || z.risk_level === "RED");
                        for (const z of critical) {
                            await fetch("/api/alerts/log", {
                                method: "POST",
                                headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({
                                    zone_id: z.zone_id,
                                    zone_name: z.zone_name,
                                    city: z.city,
                                    severity: z.risk_level,
                                    compound_alert: z.compound_alert,
                                    avg_aqi: z.avg_aqi,
                                    complaint_count: z.complaint_count,
                                    headline: z.advisory ? z.advisory.headline : "Critical Health Warning",
                                    message: z.advisory ? z.advisory.summary : "Convergence of hazardous air and illness reports."
                                })
                            });
                        }
                        const reload = await fetch("/api/alerts");
                        const reloadJson = await reload.json();
                        allAlerts = reloadJson.alerts || [];
                    }
                }

                renderAlerts();
            } catch (err) {
                console.error("Error loading alerts", err);
                alertsList.innerHTML = `<div style="color:#ef4444; text-align:center;">Failed to load alerts: ${err}</div>`;
            }
        }

        function renderAlerts() {
            const selectedCity = cityFilter.value;
            const filtered = selectedCity ? allAlerts.filter(a => a.city === selectedCity) : allAlerts;

            if (filtered.length === 0) {
                alertsList.innerHTML = `<div style="text-align:center; padding:3rem; color:#94a3b8; background:#1e293b; border-radius:8px;">No active alerts matching criteria.</div>`;
                return;
            }

            alertsList.innerHTML = "";
            filtered.forEach(a => {
                const card = document.createElement("div");
                card.className = `alert-card-item ${a.compound_alert ? "compound" : ""}`;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <span style="font-size:11px; font-weight:700; color:#38bdf8; text-transform:uppercase;">${a.alert_id} &bull; ${a.city}</span>
                            <h3 style="margin:0.25rem 0; font-size:1.2rem; color:#fff;">${a.headline || a.zone_name}</h3>
                            <div style="color:#94a3b8; font-size:0.85rem;">Zone: <strong style="color:#cbd5e1;">${a.zone_name}</strong> (${a.zone_id}) &bull; Logged: ${a.created_at}</div>
                        </div>
                        <div style="text-align:right;">
                            <span style="background:${a.compound_alert ? '#b91c1c' : '#dc2626'}; color:#fff; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:800;">
                                ${a.compound_alert ? "COMPOUND ALERT" : a.severity}
                            </span>
                            <div style="font-size:11px; color:#22c55e; margin-top:4px;">Cooldown Enforced (6h)</div>
                        </div>
                    </div>
                    <p style="margin:0.75rem 0 0 0; color:#cbd5e1; font-size:0.92rem; line-height:1.5;">${a.message}</p>
                    <div style="margin-top:0.75rem; display:flex; gap:1.5rem; font-size:0.85rem; color:#94a3b8; border-top:1px solid #334155; padding-top:0.5rem;">
                        <span>Ambient AQI: <strong style="color:#fff;">${a.avg_aqi ? a.avg_aqi.toFixed(1) : '--'}</strong></span>
                        <span>Citizen Reports: <strong style="color:#f97316;">${a.complaint_count || 0}</strong></span>
                        <span>Notification Channels: <strong style="color:#38bdf8;">Email &bull; Telegram Dispatch (Offline Simulated)</strong></span>
                    </div>
                `;
                alertsList.appendChild(card);
            });
        }

        cityFilter.addEventListener("change", renderAlerts);
        loadAlerts();
    </script>
</body>
</html>
